services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwordpress", "-pwordpress"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  wordpress:
    image: wordpress:6.6-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8083}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        @ini_set( 'display_errors', 0 );
    volumes:
      - wp-data:/var/www/html
      # The theme under test is bind-mounted so edits are live, not copied.
      - .:/var/www/html/wp-content/themes/capuchinhoverde
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # One-shot wp-cli container. Not started by `up`; used by scripts/seed.sh and
  # by `make wp` for ad-hoc commands.
  cli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp-data:/var/www/html
      - .:/var/www/html/wp-content/themes/capuchinhoverde
    entrypoint: ["wp"]

volumes:
  db-data:
  wp-data:
